# Configuración de Cámara, Doble ROI y Pipeline ALPR
version: "1.0"
camera_id: "Camara_Placas_2_Pintag"

video:
  width: 2960
  height: 1664
  clock_band_height: 120  # Banda superior del reloj estampado
  decode_backend: "auto"  # auto (NVDEC si hay GPU, sino OpenCV), nvdec, opencv
  decoder_queue_size: 128

roi:
  # 1. Crop rectangular físico (para acelerar la inferencia en YOLO reduciendo FLOPs)
  crop_rect:
    x_min: 300
    y_min: 600
    x_max: 2600
    y_max: 1664
  
  # 2. Polígono lógico del carril de lastre (coordenadas absolutas en cuadro 2960x1664)
  polygon_gravel:
    - [1484, 636]
    - [1750, 696]
    - [1854, 858]
    - [1913, 1066]
    - [2076, 1302]
    - [2372, 1554]
    - [2579, 1664]
    - [370, 1664]
    - [340, 1125]
    - [622, 918]
    - [1036, 770]
    - [1332, 681]

  # 3. Línea virtual de cruce extendida para cubrir todo el ancho de la vía en y=1200
  crossing_line:
    line_id: "LINE_MAIN_LASTRE"
    p1: [400, 1200]
    p2: [2250, 1200]
    # Sentido: cruzando hacia Y mayor (hacia la cámara) = ENTRADA
    #          cruzando hacia Y menor (hacia el fondo) = SALIDA
    direction_increasing_y: "ENTRADA"
    direction_decreasing_y: "SALIDA"

crossing:
  post_crossing_window_seconds: 0.0   # 0.0 = comportamiento actual inmediato (sin retardo)

sampling:
  sleep_sentinel_fps: 1.0     # Frecuencia del watchdog cuando la zona duerme (1 FPS)
  preactive_fps: 3.5          # Frecuencia cuando hay movimiento preliminar (3.5 FPS)
  active_fps: 6.0             # Frecuencia plena cuando hay vehículo en carril (6.0 FPS)
  active_hold_seconds: 2.5    # Tiempo para sostener ACTIVE tras última detección
  motion_threshold_ratio: 0.005 # Proporción mínima de píxeles con cambio para activar ROI

models:
  vehicle_detector:
    model_name: "yolov8n.onnx"
    runtime: "ultralytics"         # ultralytics | ort_iobinding | trt
    imgsz: 416
    conf_threshold: 0.25
    classes: [0, 1, 2, 3, 5, 7]     # person, bicycle, car, motorcycle, bus, truck
  
  plate_detector:
    model_name: "yolo-v9-t-512-license-plate-end2end"
    conf_threshold: 0.20
  
  ocr:
    engine: "fast_plate_ocr"
    model: "cct-xs-v2-global-model"
    min_confidence: 0.70              # Confianza mínima para registrar placa (evita lecturas espurias en parrillas)
    province_prior:
      enabled: false
      beta: 0.10
      manual_review_threshold: 0.15

quality_ranking:
  top_m_vehicle_frames: 8
  min_frame_separation_seconds: 0.0   # 0.0 = comportamiento actual (sin filtro de diversidad)
  top_k_plate_crops: 7
  save_candidate_manifest: false
  save_debug_crops: false             # false = evita escribir recortes JPEG intermedios de debug
  weights_vehicle:
    sharpness: 0.35
    area: 0.35
    confidence: 0.20
    border_penalty: 0.10
  weights_plate:
    conf: 0.10
    area: 0.40
    sharpness: 0.35
    aspect: 0.10
    overexposure: 0.05

deduplication:
  cooldown_seconds: 60.0
  max_levenshtein: 1

diagnostics:
  log_rejections: false  # off by default; enable via --diagnose or set true here
